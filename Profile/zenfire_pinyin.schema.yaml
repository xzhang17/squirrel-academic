# encoding: utf-8
schema:
  schema_id: zenfire_pinyin
  name: 学术拼音
  version: "0.21.1"
  dependencies: [extended_lookup, extended_mixed]

switches:
  - name: ascii_mode
    reset: 1
    states: [中, 英]
  - name: ascii_punct
    reset: 0
    states: [中式标点, 西式标点]

engine:
  processors:
    # Let the native composer track Shift taps before shortcuts pass through.
    - ascii_composer
    - lua_processor@*zenfire_first*shortcut_guard
    - lua_processor@*symbol_suggestions*processor
    - lua_processor@*extended_lookup*processor
    - lua_processor@*learning_limit*processor
    - lua_processor@*zenfire_first*processor
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors: [ascii_segmentor, lua_segmentor@*extended_lookup*segmentor, matcher, abc_segmentor, punct_segmentor, fallback_segmentor]
  translators:
    - punct_translator
    - table_translator@word_shortcuts
    - table_translator@custom_phrase
    - table_translator@english_words
    - script_translator
    - script_translator@extended_lookup
    - script_translator@extended_mixed
  # Symbols set the default order; explicit Chinese choices then take priority.
  filters: [lua_filter@*learning_limit, lua_filter@*english_order, lua_filter@*english_context, lua_filter@*extended_lookup*filter, lua_filter@*symbol_suggestions, lua_filter@*zenfire_first*filter, lua_filter@*emoji_suggestions, uniquifier]

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " '"
  algebra:
    __patch:
      - zenfire_pinyin_fuzzy:/personal_fuzzy
      - pinyin:/abbreviation
      - pinyin:/spelling_correction

# Octagram scores word combinations within the current pinyin composition.
grammar:
  language: wanxiang-lts-zh-hans
  collocation_max_length: 6
  collocation_min_length: 2
  collocation_penalty: -14
  non_collocation_penalty: -6
  weak_collocation_penalty: -100
  rear_penalty: -18

translator:
  dictionary: zenfire_pinyin
  prism: zenfire_pinyin
  max_homophones: 2
  contextual_suggestions: false
  # Use the same name for local learning and its manual snapshot.
  user_dict: zenfire_pinyin
  enable_user_dict: true
  # Native combination limit; learning_limit also blocks oversized components.
  max_word_length: 8
  preedit_format:
    - xform/([nl])v/$1ü/
    - xform/([nl])ue/$1üe/
    - xform/([jqxy])v/$1u/

# A new manual choice gets one second-place trial; usage then determines rank.
chinese_learning:
  max_chars: 8
  score_decay: 0.995
  min_lead: 2
  lead_ratio: 1.2

extended_lookup:
  tag: extended_lookup
  dictionary: extended_lookup
  prism: extended_lookup
  enable_user_dict: false
  enable_completion: false
  enable_sentence: false

# The Latin letters in mixed terms use their own spelling index. A literal S
# must not suppress the pinyin initial s in searches of the Chinese dictionaries.
extended_mixed:
  tag: extended_lookup
  dictionary: extended_mixed
  prism: extended_mixed
  enable_user_dict: false
  enable_completion: false
  enable_sentence: false
  initial_quality: 1

# Text tables are read-only. Exact shortcuts can outrank ordinary suggestions.
word_shortcuts:
  dictionary: ""
  user_dict: word_shortcuts
  db_class: stabledb
  enable_completion: false
  enable_sentence: false
  initial_quality: 99

custom_phrase:
  dictionary: ""
  user_dict: custom_phrase
  db_class: stabledb
  enable_completion: false
  enable_sentence: false
  initial_quality: 98

english_words:
  dictionary: ""
  user_dict: dicts/en_dicts/english_words
  db_class: stabledb
  enable_completion: false
  enable_sentence: false
  initial_quality: 90

# Shared exceptions. The account's own exact custom phrases also take priority.
english_first:
  ai: AI
  cpu: CPU
  gpu: GPU
  pdf: PDF
  usb: USB
  wifi: Wi-Fi

recognizer:
  import_preset: default

key_binder:
  import_preset: default

