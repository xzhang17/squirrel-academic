patch:
  schema_list:
    - schema: zenfire_pinyin
  menu/page_size: 7
  ascii_composer/switch_key/Shift_L: commit_code
  ascii_composer/switch_key/Shift_R: commit_code
  ascii_composer/switch_key/Caps_Lock: noop
  ascii_composer/switch_key/Eisu_toggle: noop
  switcher/caption: 〔输入方案〕
  switcher/hotkeys: []
  switcher/save_options: [ascii_punct]
  # Do not inherit a second punctuation-width table from the preset.
  punctuator/full_shape: {}
  # Tab moves the pinyin caret. The engine still handles arrow keys and paging.
  selector: {}
  key_binder/bindings:
    # Ordinary candidate controls only; macOS keeps modifier-key shortcuts.
    - {when: has_menu, accept: minus, send: Page_Up}
    - {when: has_menu, accept: equal, send: Page_Down}
