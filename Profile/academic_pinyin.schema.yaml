# encoding: utf-8
schema:
  schema_id: academic_pinyin
  name: 学术拼音
  version: "0.20.2"
  dependencies: [extended_lookup, extended_mixed]

switches:
  - name: ascii_mode
    reset: 1
    states: [中, 英]
  - name: ascii_punct
    reset: 0
    states: [中式标点, 西式标点]

engine:
  processors:
    # Let the native composer track Shift taps before shortcuts pass through.
    - ascii_composer
    - lua_processor@*academic_first*shortcut_guard
    - lua_processor@*symbol_suggestions*processor
    - lua_processor@*extended_lookup*processor
    - lua_processor@*learning_limit*processor
    - lua_processor@*academic_first*processor
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors: [ascii_segmentor, lua_segmentor@*extended_lookup*segmentor, matcher, abc_segmentor, punct_segmentor, fallback_segmentor]
  translators:
    - punct_translator
    - table_translator@word_shortcuts
    - table_translator@custom_phrase
    - table_translator@english_words
    - script_translator
    - script_translator@extended_lookup
    - script_translator@extended_mixed
  # Reserve symbol positions before emoji counts the remaining page slots.
  filters: [lua_filter@*learning_limit, lua_filter@*english_order, lua_filter@*english_context, lua_filter@*academic_first*filter, lua_filter@*extended_lookup*filter, lua_filter@*symbol_suggestions, lua_filter@*emoji_suggestions, uniquifier]

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " '"
  algebra:
    __patch:
      - academic_fuzzy:/personal_fuzzy
      - pinyin:/abbreviation
      - pinyin:/spelling_correction
      - pinyin:/key_correction

translator:
  dictionary: academic_pinyin
  prism: academic_pinyin
  enable_user_dict: true
  # Native combination limit; learning_limit also blocks oversized components.
  max_word_length: 8
  preedit_format:
    - xform/([nl])v/$1ü/
    - xform/([nl])ue/$1üe/
    - xform/([jqxy])v/$1u/

# Two deliberate Chinese choices promote a word to second, then first place.
chinese_learning:
  max_chars: 8

extended_lookup:
  tag: extended_lookup
  dictionary: extended_lookup
  prism: extended_lookup
  enable_user_dict: false
  enable_completion: false
  enable_sentence: false

# The Latin letters in mixed terms use their own spelling index. A literal S
# must not suppress the pinyin initial s in searches of the Chinese dictionaries.
extended_mixed:
  tag: extended_lookup
  dictionary: extended_mixed
  prism: extended_mixed
  enable_user_dict: false
  enable_completion: false
  enable_sentence: false
  initial_quality: 1

# Text tables are read-only. Exact shortcuts can outrank ordinary suggestions.
word_shortcuts:
  dictionary: ""
  user_dict: word_shortcuts
  db_class: stabledb
  enable_completion: false
  enable_sentence: false
  initial_quality: 99

custom_phrase:
  dictionary: ""
  user_dict: custom_phrase
  db_class: stabledb
  enable_completion: false
  enable_sentence: false
  initial_quality: 98

english_words:
  dictionary: ""
  user_dict: en_dicts/english_words
  db_class: stabledb
  enable_completion: false
  enable_sentence: false
  initial_quality: 90

# Shared exceptions. The account's own exact custom phrases also take priority.
english_first:
  ai: AI
  cpu: CPU
  gpu: GPU
  pdf: PDF
  usb: USB
  wifi: Wi-Fi

punctuator:
  __include: symbols:/punctuator

recognizer:
  import_preset: default
  patterns:
    punct: '^/([0-9]0?|[A-Za-z]+)$'

key_binder:
  import_preset: default

__patch:
  - academic_pinyin.custom:/patch?
